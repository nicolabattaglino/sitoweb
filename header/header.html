<!-- header.html -->
<header>
    <div class="logo">
        <div class="name">
            <span class="bold">CATERINA</span><br>
            <span class="bold">DI BERNARDO</span>
        </div>
        <div class="separator"></div>
        <span class="thin">ARCHITETTO</span>
    </div>
    <div class="menu-toggle" id="menu-toggle">
        <span></span>
        <span></span>
    </div>
    <nav>
        <ul>
            <li><a href="../home">BENVENUTI</a></li>
            <li><a href="../progetti/progetti.html">PROGETTI</a></li>
            <li><a href="../sudime/sudime.html">SU DI ME</a></li>
            <li><a href="../servizi/servizi.html">SERVIZI</a></li>
            <li><a href="../contatti/contatti.html">CONTATTI</a></li>
        </ul>
    </nav>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let path = window.location.pathname; // Ottiene il percorso URL della pagina attuale
            let navLinks = document.querySelectorAll("nav ul li a"); // Trova tutti i link nel menu
        
            navLinks.forEach(link => {
                let href = link.getAttribute("href").replace("..", ""); // Normalizza l'href
            
                if (path.includes(href)) {
                    link.classList.add("active"); // Aggiunge la classe "active" al link corrispondente
                }
            });
        });
    </script>  
</header>
